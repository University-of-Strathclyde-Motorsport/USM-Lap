version: 1
disable_existing_loggers: true

formatters:
  brief:
    fmt: "%(message)s"
  default:
    fmt: "%(asctime)s %(levelname)s - %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: rich.logging.RichHandler
    formatter: brief
    level: INFO
  log_file:
    class: logging.FileHandler
    formatter: default
    level: DEBUG
    filename: TODO
    mode: w

loggers:
  matplotlib:
    level: WARNING
  PIL:
    level: WARNING

root:
  level: NOTSET
  handlers: [console]
  propagate: yes

version: 1
disable_existing_loggers: true

formatters:
  brief:
    format: "%(levelname)s - %(message)s"
  default:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: rich.logging.RichHandler
    formatter: default
    level: INFO

root:
  level: INFO
  handlers: [console]
  propagate: yes

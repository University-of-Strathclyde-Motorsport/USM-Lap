[project]
name = "usmlap"
version = "0.1.0"
description = "USM laptime simulator, built in Python"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "annotated-types>=0.7.0",
    "matplotlib>=3.10.6",
    "matplotlib-stubs>=0.3.11",
    "numpy>=2.3.2",
    "openpyxl>=3.1.5",
    "pandas-stubs>=2.3.2.250827",
    "pint>=0.25.3",
    "polars>=1.44.2",
    "pydantic>=2.11.7",
    "pyyaml>=6.0.3",
    "pyyaml-include>=2.2",
    "rich>=14.3.2",
    "scipy>=1.16.2",
    "scipy-stubs>=1.16.2.4",
    "typer>=0.27.3",
]

[project.scripts]
usmlap = "usmlap.cli:app"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "graphviz>=0.21",
    "pre-commit>=4.6.2",
    "pylint>=4.0.4",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.pytest.ini_options]
testpaths  = "tests"

[tool.coverage.run]
source_pkgs = ["usmlap"]
omit = ["__main__.py"]

[tool.coverage.report]
skip_empty = true

[tool.ruff]
fix = true
src = ["src"]
line-length = 80

[tool.ruff.lint]
extend-select = ["B", "I", "Q", "S", "C4", "E"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "INP001", "S101", "PLR2004", "PT011"]

[tool.ruff.lint.isort]
known-first-party = ["analysis", "plot", "competition", "simulation", "solver", "track", "utils", "vehicle"]


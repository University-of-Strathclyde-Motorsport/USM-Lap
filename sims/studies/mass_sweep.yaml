study_name: MassSweep

base_settings:
  sim_name: TestSimulation
  solver: quasi-steady-state
  outings: !include "sims/definitions/competition.yaml"
  vehicle: !include "sims/definitions/baseline_vehicle.yaml"
  boundary_conditions:
    initial_soc: 1
    initial_cell_temperature: 32
    initial_velocity: 0

sweep:
  vehicle:
    parameters:
      inertia:
        curb_mass: [180, 200, 220, 240, 260]

plots:
  line:
    - title: "Mass Sensitivity"
      outing_id: autocross
      colour: "#003366"
      x_value: vehicle.parameters.inertia.curb_mass
      y_value: laptime
      x_label: Curb Mass (kg)
      y_label: Laptime (s)
  waveform:
    - config: general
      outing_id: autocross
